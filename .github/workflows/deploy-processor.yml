name: deploy-processor

on:
  workflow_dispatch:
    # Hosted development is disabled. For future re-enablement, restore this
    # selector and wire job environment, STAGE and concurrency to its value.
    # inputs:
    #   environment:
    #     description: GitHub Environment and AWS stage to deploy
    #     required: true
    #     default: prod
    #     type: choice
    #     options:
    #       - prod
    #       - dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-processor-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy processor to prod
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: us-east-1
      STAGE: prod
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify AWS deployment configuration
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is not available in the selected GitHub Environment."
            exit 1
          fi
          if ! printf '%s' "$AWS_DEPLOY_ROLE_ARN" | grep -Eq '^arn:aws:iam::[0-9]{12}:role/.+'; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is not a valid IAM role ARN."
            exit 1
          fi
          if ! printf '%s' "$AWS_ACCOUNT_ID" | grep -Eq '^[0-9]{12}$'; then
            echo "::error::AWS_ACCOUNT_ID must be the 12-digit target AWS account ID."
            exit 1
          fi

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet test 3d-processor.slnx --nologo
      - name: Install Lambda packaging tool
        run: dotnet tool install --global Amazon.Lambda.Tools --version 7.0.0
      - run: make package

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          retry-max-attempts: 3

      - name: Update processor Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "3d-processor-$STAGE" \
            --zip-file fileb://artifacts/3d-processor.zip \
            --publish
          aws lambda wait function-updated --function-name "3d-processor-$STAGE"
