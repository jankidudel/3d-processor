name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test 3d-processor.slnx --nologo
      - run: dotnet tool install -g Amazon.Lambda.Tools --version 7.0.0
      - run: make package
